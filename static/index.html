<!doctype html>
<html lang="zh-CN" data-accent="cyan" data-view="overview">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="color-scheme" content="dark">
<meta name="description" content="NTE 比赛（异环）通用赛事平台：自动分组、积分结算、选手档案与直播推流。">
<title>NTE 比赛 · 赛事平台</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<!-- 老浏览器不认 SVG 图标时退回 .ico；现代浏览器用上面那个矢量图（任何尺寸都清晰） -->
<link rel="alternate icon" href="/favicon.ico" type="image/x-icon">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/css/nte.css">
</head>
<body>

<div class="fx" aria-hidden="true">
  <div class="fx__grid"></div>
  <div class="fx__glow fx__glow--a"></div>
  <div class="fx__glow fx__glow--b"></div>
  <div class="fx__scan"></div>
  <div class="fx__noise"></div>
</div>

<header class="hud">
  <div class="hud__brand">
    <span class="logo-plate" aria-hidden="true">
      <!-- 品牌标记：渐变用主题变量而不是写死的颜色，换主题色 / 自定义色都会跟着变 -->
      <svg class="mark" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="markGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" style="stop-color:var(--accent)"/>
            <stop offset="50%" style="stop-color:var(--accent-2, var(--accent))"/>
            <stop offset="100%" style="stop-color:var(--accent)"/>
          </linearGradient>
        </defs>
        <polygon points="24,3 41.5,13 41.5,35 24,45 6.5,35 6.5,13" fill="none" stroke="url(#markGrad)" stroke-width="3.4" stroke-linejoin="round"/>
        <circle cx="24" cy="24" r="9" fill="none" stroke="url(#markGrad)" stroke-width="2.6"/>
        <path d="M14.6 24h18.8M24 14.6c4.2 5.5 4.2 13.3 0 18.8M24 14.6c-4.2 5.5-4.2 13.3 0 18.8" fill="none" stroke="url(#markGrad)" stroke-width="1.8" opacity=".9"/>
      </svg>
    </span>
    <div class="hud__titles">
      <h1 class="hud__title stroke" id="evtTitle" data-text="NTE 比赛">NTE 比赛</h1>
      <p class="hud__sub" id="evtSub">NEVERNESS TO EVERNESS · MATCH</p>
    </div>
  </div>

  <div class="hud__meta">
    <span class="chip chip--event" id="chipEvent" title="正在看哪一届" hidden>—</span>
    <span class="chip chip--time" id="chipEventTime" hidden title="赛事起止时间">—</span>
    <button class="btn btn--icon" id="btnRefresh" type="button" title="立即同步" aria-label="立即同步">
      <span class="ic" data-icon="refresh"></span>
    </button>
    <button class="btn btn--ghost" id="btnLogin" type="button" hidden>登录</button>
    <button class="btn btn--ghost" id="btnAdmin" type="button" hidden>管理</button>
    <button class="hud__me" id="btnMe" type="button" hidden aria-current="false"
            title="我的资料（/user）">
      <span class="hud__me-ava" id="meAvatar" aria-hidden="true"></span>
      <span class="hud__me-name" id="meName"></span>
    </button>
  </div>
</header>
<div class="hud__stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<!-- 导航进度条：切换页面时立刻出现（不确定进度，滚动光带），到手就淡出 -->
<div class="nav-progress" id="navProgress" aria-hidden="true"><i></i></div>

<nav class="tabs" id="tabs" aria-label="主导航">
  <span class="tabs__deco" aria-hidden="true"></span>
  <button class="tab tab--home" type="button" data-view="home" aria-current="false">
    <span class="ic" data-icon="home"></span>
    <span>主页</span>
  </button>
  <button class="tab" type="button" data-view="overview" aria-current="true">
    <span class="ic" data-icon="chart"></span>
    <span>总览</span>
  </button>
  <button class="tab" type="button" data-view="schedule" aria-current="false">
    <span class="ic" data-icon="list"></span>
    <span>赛程</span>
  </button>
  <button class="tab" type="button" data-view="roster" aria-current="false">
    <span class="ic" data-icon="users"></span>
    <span>选手</span>
  </button>
  <button class="tab" type="button" data-view="live" aria-current="false">
    <span class="ic" data-icon="video"></span>
    <span>直播</span>
  </button>
  <button class="tab tab--admin" type="button" data-view="manage" aria-current="false">
    <span class="ic" data-icon="shield"></span>
    <span>赛事管理</span>
  </button>
</nav>

<main class="stage" id="stage">

  <section class="view" id="view-home" data-view="home" hidden>
    <div id="homeBody"></div>
  </section>

  <section class="view" id="view-overview" data-view="overview">
    <div class="kpi" id="kpiRow"></div>
    <div class="panel panel--brief" id="eventBrief" hidden></div>
    <div class="panel panel--time" id="eventTimePanel" hidden></div>
    <div class="panel" id="championBox" hidden></div>
    <div class="panel" id="nowPlaying" hidden></div>
    <div class="panel" id="bracketBoard" hidden></div>
    <div class="panel" id="standingsBoard" hidden></div>
    <div class="panel" id="subsBoard" hidden></div>
    <div class="panel" id="formBoard" hidden></div>
    <div class="panel" id="noticeBoard" hidden></div>
    <div class="panel" id="rulesBoard" hidden></div>
  </section>

  <section class="view" id="view-schedule" data-view="schedule" hidden>
    <div class="panel panel--toolbar" id="scheduleTools"></div>
    <div id="scheduleGrid"></div>
  </section>

  <section class="view" id="view-roster" data-view="roster" hidden>
    <div class="panel panel--toolbar" id="rosterTools"></div>
    <div class="roster-grid" id="rosterGrid"></div>
  </section>

  <section class="view" id="view-live" data-view="live" hidden>
    <div class="panel panel--stage" id="liveStage"></div>
    <div class="grid grid--2">
      <div class="panel" id="pushPanel"></div>
      <div class="panel" id="liveInfoPanel"></div>
    </div>
  </section>

  <section class="view" id="view-channels" data-view="channels" hidden>
    <div class="panel" id="channelNotice" hidden></div>
    <div class="panel panel--stage" id="channelStage"></div>
    <div class="panel panel--toolbar" id="channelTools"></div>
    <div class="roster-grid" id="channelGrid"></div>
  </section>

  <section class="view" id="view-events" data-view="events" hidden>
    <div id="eventsBoard"></div>
  </section>

  <section class="view" id="view-manage" data-view="manage" hidden>
    <div id="adminGate"></div>
    <div id="adminPanel"></div>
  </section>

  <section class="view" id="view-server" data-view="server" hidden>
    <div id="serverBody"></div>
  </section>

  <section class="view" id="view-user" data-view="user" hidden>
    <div id="userBody"></div>
  </section>

  <!-- 开发者页（/developer）：关于作者、联系方式、开源许可与开源组件清单 -->
  <section class="view" id="view-developer" data-view="developer" hidden>
    <div id="developerBody"></div>
  </section>

  <section class="view" id="view-denied" data-view="denied" hidden>
    <div id="deniedBody"></div>
  </section>

</main>

<!-- 页脚：入口、署名与许可。刻意做成静态 HTML（不依赖 JS 与接口）——
     署名不该因为一次请求失败就消失；只有「开源组件」清单由 JS 现取。
     头像是可选的网络资源，所以放在「开发者」页里，页脚只留文字。 -->
<footer class="foot" id="siteFoot">
  <nav class="foot__links" aria-label="站点链接与许可">
    <a class="foot__link" href="/developer" data-route
       title="开发者信息、联系方式与开源许可"><span class="ic" data-icon="user"></span>开发者</a>
    <a class="foot__link" href="https://space.bilibili.com/11393965" target="_blank" rel="noopener noreferrer"
       title="开发者的 B 站个人空间"><span class="ic" data-icon="video"></span>B 站</a>
    <a class="foot__link" href="https://github.com/PureAmaya/NTEmatch" target="_blank" rel="noopener noreferrer"
       title="本站源码（AGPL-3.0）"><span class="ic" data-icon="code"></span>源码</a>
    <a class="foot__link" href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer"
       title="GNU Affero 通用公共许可证 v3.0 全文"><span class="ic" data-icon="shield"></span>AGPL-3.0</a>
    <button class="foot__link foot__link--btn" type="button" data-act="credits"
            title="本站用到的开源组件与各自许可">
      <span class="ic" data-icon="book"></span>开源组件
    </button>
  </nav>
  <div class="foot__meta">
    <p class="foot__note">
      本站以 <b>AGPL-3.0</b> 许可开源 · © 早八时睡觉的你 · 源码
      <a class="foot__repo" href="https://github.com/PureAmaya/NTEmatch"
         target="_blank" rel="noopener noreferrer">github.com/PureAmaya/NTEmatch</a>
    </p>
    <p class="foot__fine">
      第三方组件与 MediaMTX 的许可详见「开源组件」 · 修改后对外提供服务，请同样公开源码
    </p>
  </div>
</footer>

<div id="customHtmlHost" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close="1"></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal__head">
      <h2 class="ol-w" id="modalTitle">标题</h2>
      <button class="btn btn--icon btn--ghost" type="button" data-close="1" aria-label="关闭">
        <span class="ic" data-icon="close"></span>
      </button>
    </header>
    <div class="modal__body" id="modalBody"></div>
    <footer class="modal__foot" id="modalFoot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
