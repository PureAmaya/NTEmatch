name: astrbot_plugin_nte_match
display_name: NTE 比赛
desc: 把 NTE 比赛平台的赛事列表 / 信息 / 进度 / 结果接进群聊：25 条群命令（含自助报名 / 取消报名），不依赖任何大模型（不注册 LLM 工具）；另外负责「真 @ 投递」——站点排队的召集 / 提醒由它用 At 组件发（AstrBot 的 OpenAPI 没有 at 段）。
help: 发送「比赛帮助」查看可用命令（配了「帮助图」时直接回一张图）。
