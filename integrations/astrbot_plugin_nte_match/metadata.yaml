name: astrbot_plugin_nte_match
display_name: NTE 比赛
desc: 把 NTE 比赛平台的赛事列表 / 信息 / 进度 / 结果接进群聊：25 条群命令（含自助报名 / 取消报名，都不经过大模型）+ 4 个可选的 LLM 工具（查询 / 报名 / 我的资料 / 帮助；工具只回文本、不碰人格，凭据类能力不给模型）；另外负责「真 @ 投递」——站点排队的召集 / 提醒由它用 At 组件发（AstrBot 的 OpenAPI 没有 at 段）。
help: 发送「比赛帮助」查看可用命令（配了「帮助图」时直接回一张图）。
version: 1.3.0
author: 早八时睡觉的你
repo: "https://github.com/PureAmaya/NTEmatch"
